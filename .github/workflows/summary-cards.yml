name: Summary Cards

on:
  workflow_dispatch: {}         
  schedule:
    - cron: "0 */6 * * *"       

permissions:
  contents: write               

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: kianisanaullah
          THEME: default         
          UTC_OFFSET: "+04:00"   
