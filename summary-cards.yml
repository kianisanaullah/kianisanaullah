name: Summary Cards
on:
  schedule: [{cron: "0 0 * * *"}] # daily
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: kianisanaullah
          UTC_OFFSET: "+04:00"
          THEME: github   # You can use dracula, tokyonight, solarized, monokai
